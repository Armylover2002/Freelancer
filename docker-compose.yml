# Local/staging convenience orchestration. Both services read secrets from their
# own .env files (never committed) - MongoDB Atlas and Cloudinary remain external.
services:
  backend:
    build: ./Backend
    env_file: ./Backend/.env
    ports:
      - '5000:5000'
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - '8080:80'
    depends_on:
      - backend
    restart: unless-stopped
